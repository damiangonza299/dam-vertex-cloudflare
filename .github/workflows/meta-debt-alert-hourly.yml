name: Dam Intelligence — Alerta Deuda Meta Ads

# Corre cada hora (top of hour, UTC — GitHub Actions no garantiza el minuto
# exacto, puede atrasarse 5-15 min en horas pico).
#
# Consulta la deuda actual (amount_spent) de la cuenta Meta Ads
# act_992345752726304 (PYG). Si supera Gs. 700.000, envía alerta al grupo
# Telegram DAM INTELLIGENCE. No repite antes de 6h aunque siga alta.
#
# NO pausa anuncios. NO modifica Meta Ads. Solo lectura de Meta API +
# envío de texto a Telegram.
#
# Requiere secrets en GitHub → Settings → Secrets → Actions:
#   SERVICE_SECRET                — mismo valor que env SERVICE_SECRET en Cloudflare Pages
#   (TELEGRAM_BOT_TOKEN, TELEGRAM_INTELLIGENCE_CHAT_ID, META_MARKETING_TOKEN,
#    META_AD_ACCOUNT_ID se configuran como secrets de Cloudflare Pages, no de GitHub)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  meta-debt-alert:
    name: Chequear deuda Meta Ads y alertar si supera el umbral
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}

    steps:
      - name: POST /api/intelligence/meta-debt-alert
        run: |
          HTTP=$(curl -s \
            -o /tmp/debt_result.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $SERVICE_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            https://dam-vertex-cloudflare.pages.dev/api/intelligence/meta-debt-alert)

          echo "HTTP Status: $HTTP"
          echo "Response:"
          cat /tmp/debt_result.json

          if [ "$HTTP" != "200" ]; then
            echo "::warning::meta-debt-alert returned HTTP $HTTP"
          fi

      - name: Verificar resultado
        run: |
          SENT=$(cat /tmp/debt_result.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sent', False))")
          DEUDA=$(cat /tmp/debt_result.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deuda', 'n/a'))")
          echo "Deuda actual: Gs. $DEUDA"
          echo "Alerta enviada: $SENT"
