<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840" role="img" aria-label="Proyector Astronauta de Sistema Solar">
  <defs>
    <radialGradient id="bgp" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#c7d0ec"/>
    </linearGradient>
  </defs>
  <rect width="840" height="840" fill="url(#bgp)"/>
  <!-- Estrellas -->
  <g fill="#f0f4ff">
    <circle cx="80" cy="120" r="2"/><circle cx="160" cy="60" r="1.5"/><circle cx="720" cy="90" r="2"/>
    <circle cx="670" cy="180" r="1.5"/><circle cx="60" cy="300" r="1.5"/><circle cx="770" cy="320" r="2"/>
    <circle cx="120" cy="500" r="1.5"/><circle cx="740" cy="560" r="1.5"/><circle cx="90" cy="680" r="2"/>
    <circle cx="700" cy="700" r="1.5"/><circle cx="400" cy="60" r="1.5"/><circle cx="300" cy="740" r="2"/>
    <circle cx="500" cy="760" r="1.5"/>
  </g>
  <!-- Haz de proyección -->
  <polygon points="420,300 260,780 580,780" fill="url(#beam)"/>
  <!-- Planeta pequeño -->
  <circle cx="640" cy="230" r="26" fill="#6c3fc5" opacity="0.85"/>
  <ellipse cx="640" cy="230" rx="42" ry="10" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.7"/>
  <!-- Astronauta simplificado -->
  <g transform="translate(420,470)">
    <ellipse cx="0" cy="180" rx="70" ry="16" fill="#000" opacity="0.25"/>
    <rect x="-55" y="-40" width="110" height="150" rx="45" fill="url(#suit)"/>
    <circle cx="0" cy="-90" r="62" fill="url(#suit)"/>
    <circle cx="0" cy="-90" r="46" fill="#0a0e1a"/>
    <circle cx="0" cy="-90" r="46" fill="#4fc3f7" opacity="0.18"/>
    <rect x="-70" y="-10" width="26" height="70" rx="13" fill="#c7d0ec"/>
    <rect x="44" y="-10" width="26" height="70" rx="13" fill="#c7d0ec"/>
    <rect x="-30" y="105" width="26" height="80" rx="13" fill="#c7d0ec"/>
    <rect x="4" y="105" width="26" height="80" rx="13" fill="#c7d0ec"/>
  </g>
  <text x="420" y="800" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f0f4ff" opacity="0.8">Imagen próximamente — placeholder</text>
</svg>
