<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c518" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8a020" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="840" height="840" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="800" height="800" rx="20" fill="none" stroke="#e8a020" stroke-width="2" opacity="0.4"/>
  <!-- Silueta simple de lámpara de escritorio flexible con soporte de celular -->
  <g transform="translate(420,430)">
    <circle cx="60" cy="-190" r="150" fill="url(#glow)"/>
    <!-- base -->
    <rect x="-90" y="150" width="180" height="18" rx="9" fill="#26263f" stroke="#e8a020" stroke-width="2"/>
    <!-- soporte de celular en la base -->
    <rect x="-140" y="120" width="34" height="48" rx="6" fill="#26263f" stroke="#f5c518" stroke-width="2"/>
    <!-- brazo flexible (curva tipo gooseneck) -->
    <path d="M -30 150 C -30 40, 10 20, 20 -60 C 28 -120, 45 -150, 60 -190"
          fill="none" stroke="#e8a020" stroke-width="10" stroke-linecap="round"/>
    <!-- cabezal de luz -->
    <ellipse cx="60" cy="-190" rx="52" ry="34" fill="#f5c518"/>
    <ellipse cx="60" cy="-190" rx="34" ry="20" fill="#fff176"/>
  </g>
  <text x="420" y="640" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#f5c518" letter-spacing="1">LÁMPARA PLEGABLE</text>
  <text x="420" y="678" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" opacity="0.85">3 tonos de luz · recargable</text>
  <text x="420" y="740" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff" opacity="0.4">Foto real próximamente — reemplazar en /lampara-escritorio-plegable/</text>
</svg>
